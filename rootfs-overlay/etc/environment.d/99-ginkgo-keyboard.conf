# One keyboard engine only: the KDE/Qt on-screen keyboard.
# QT_IM_MODULE (old name) must agree with QT_IM_MODULES, otherwise a second
# engine claims the text field and the keyboard closes itself again.
# System-wide so the greeter and the lock screen get it too.
QT_IM_MODULES=qtvirtualkeyboard
QT_IM_MODULE=qtvirtualkeyboard
QT_VIRTUALKEYBOARD_LOCALE=en_US
