# Use case configuration for Xiaomi Redmi Note 8 (SM6125 ginkgo)
# Speaker (MAX98927) on PRI_MI2S_RX

SectionVerb {
    EnableSequence [
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
    ]
    DisableSequence [
        cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
    ]
    Value {
        TQ "HiFi"
    }
}

SectionDevice."Speaker" {
    Comment "Internal Loudspeaker"

    EnableSequence [
        cset "name='Amp DSP Switch' 1"
        cset "name='Speaker Volume' 5"
        cset "name='Digital Volume' 115"
    ]
    DisableSequence [
        cset "name='Amp DSP Switch' 0"
    ]

    Value {
        PlaybackPriority 100
        PlaybackPCM "hw:${CardId},0"
    }
}
